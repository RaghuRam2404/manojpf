<div id="intro-gate" aria-label="Interactive site introduction">
  <div class="intro-gate__texture"></div>
  <div class="intro-gate__wash intro-gate__wash--one"></div>
  <div class="intro-gate__wash intro-gate__wash--two"></div>
  <canvas class="intro-gate__backdrop" aria-hidden="true"></canvas>
  <canvas class="intro-gate__canvas" aria-label="Draw an M to enter"></canvas>
  <div class="intro-gate__scan" aria-hidden="true"></div>
  <div class="intro-gate__brush" aria-hidden="true"></div>
  <div class="intro-gate__content">
    <!--img src="assets/Logos/manoj logo.svg" alt="Manoj Shakar" class="intro-gate__logo" /-->
    <!--p class="intro-gate__eyebrow">A product designer's portfolio</p-->
    <p class="intro-gate__prompt hn">Draw M <span>to unlock website</span></p>
    <div class="intro-gate__skip-action">
      <span class="intro-gate__skip-hint">Press <kbd>esc</kbd> key or</span>
      <button type="button" class="intro-gate__skip">Skip</button>
    </div>
  </div>
</div>
